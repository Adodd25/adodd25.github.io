{{- /* Animated network-defense background (full strength on the home page, softer elsewhere). */ -}}
<canvas id="cyber-bg" aria-hidden="true" data-intensity="{{ if .IsHome }}1{{ else }}0.5{{ end }}"></canvas>
{{- $js := slice (resources.Get "js/cyber-bg.js") (resources.Get "js/fancy.js") | resources.Concat "js/site.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
